<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: __W__px;
        height: __H__px;
        background: linear-gradient(135deg, __BG__ 0%, __BG2__ 100%);
        font-family: __FONT__;
        color: __INK__;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 56px 80px;
        display: flex;
        flex-direction: column;
      }
      .center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .big {
        font-size: 72px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .rad {
        display: inline-block;
        position: relative;
        padding-left: 0.6em;
        border-top: 2.5px solid currentColor;
      }
      .rad::before {
        content: "√";
        position: absolute;
        left: 0.02em;
        top: -0.04em;
        font-size: 1.05em;
        line-height: 1;
        transform: scaleY(1.35);
        transform-origin: top left;
      }
      .underline {
        width: 96px;
        height: 6px;
        background: __ACCENT__;
        border-radius: 3px;
        margin-top: 28px;
      }
      .sub {
        margin-top: 16px;
        font-size: __SUB_SIZE__px;
        color: __INK_SUB__;
        letter-spacing: 0.5px;
      }
      .body {
        margin-top: 18px;
        font-size: calc(__BODY_SIZE__px * 0.6);
        line-height: 1.5;
        font-weight: 600;
        color: __INK__;
      }
      .hl {
        color: __ACCENT__;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="center">
        <div class="big">__HEADER__</div>
        <div class="underline"></div>
        <div class="sub">__SUB__</div>
        <div class="body">__BODY__</div>
      </div>
    </div>
  </body>
</html>
