<!doctype html>
<!--
  Rule page block: WebGL radial-blur shader, dramatic zoom transition.
  Source: https://github.com/heygen-com/hyperframes (Apache-2.0)
  Adapted for micro-course `rule` page-role.

  Page-role fit
  ─────────────
  - rule 出现 → 入场时从 "far" 状态模糊放大到 "in" 状态
  - 规则文字 → 中心清晰呈现
  - 规则结束 → 反向缩回 "far"

  WebGL2 可用时自动走 shader；不可用时回退到 GSAP-only 简单缩放（保底）。
  需要 GPU 加速，本机渲染约 30fps @ 1920x1080。

  数据替换：搜 "REPLACE ME" 改场景 / 文案 / 时长。
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Lato:wght@400;700&display=block");
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #3d348b;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <style>
        [data-composition-id="main"] {
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          position: relative;
          background: #3d348b;
        }
        .bp-grid {
          position: absolute; inset: 0;
          background-image:
            linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
          background-size: 40px 40px;
          pointer-events: none;
        }
        .bp-divider {
          position: absolute; left: 1200px; top: 60px; bottom: 60px; width: 1px;
          background: #f7b801; opacity: 0.15;
        }
        .scene {
          position: absolute; top: 0; left: 0; width: 1200px; height: 1080px;
          overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .scene-label {
          font-family: "Bebas Neue", sans-serif;
          font-size: 140px; letter-spacing: 0.06em; opacity: 0.12;
        }
      </style>

      <div class="bp-grid"></div>
      <div class="bp-divider"></div>

      <!-- REPLACE ME: 两个场景是"远→近" zoom blur 的两端 -->
      <div id="s1" class="scene" style="background: #3d348b">
        <div class="scene-label" id="bp-label-from" style="color: #f7b801">RULE</div>
      </div>
      <div id="s2" class="scene" style="background: #f7b801; opacity: 0">
        <div class="scene-label" id="bp-label-to" style="color: #3d348b">结构</div>
      </div>

      <canvas id="gl-canvas" width="1200" height="1080" style="
        position: absolute; top: 0; left: 0; width: 1200px; height: 1080px;
        z-index: 10; pointer-events: none; display: none;
      "></canvas>

      <!-- REPLACE ME: 右侧写规则的简述 / 例句 -->
      <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 720px;
                  display: flex; flex-direction: column; justify-content: center;
                  padding: 60px 60px 60px 40px; color: #f7b801;
                  font-family: 'Lato', sans-serif;">
        <div id="bp-rule-title" style="font-family: 'Bebas Neue', sans-serif; font-size: 38px;
                    letter-spacing: 0.08em; margin-bottom: 20px;">核心规则</div>
        <div id="bp-rule-body" style="font-family: 'JetBrains Mono', monospace; font-size: 22px;
                    line-height: 1.7; padding: 16px 20px; border-radius: 6px;
                    background: rgba(247,184,1,0.06); border: 1px solid rgba(247,184,1,0.12);">
          be (am/is/are) + V-ing<br/>
          表示"此刻正在发生"
        </div>
      </div>
      <div style="position:absolute;right:28px;bottom:16px;z-index:9999;font-size:18px;color:rgba(247,184,1,0.55);font-family:sans-serif;pointer-events:none;">Motion by hyperframes</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // 集成层经 window.__BLOCK_CONFIG 覆盖（sceneFrom/sceneTo/ruleTitle/ruleBody）
      // ruleBody 纯文本：用 textContent + <br>，不用 innerHTML（防分镜 HTML 注入）
      (function () {
        var CFG = window.__BLOCK_CONFIG || {};
        if (CFG.sceneFrom) document.getElementById("bp-label-from").textContent = CFG.sceneFrom;
        if (CFG.sceneTo) document.getElementById("bp-label-to").textContent = CFG.sceneTo;
        if (CFG.ruleTitle) document.getElementById("bp-rule-title").textContent = CFG.ruleTitle;
        if (CFG.ruleBody) {
          var el = document.getElementById("bp-rule-body");
          el.textContent = "";
          String(CFG.ruleBody).split("\n").forEach(function (line, i) {
            if (i) el.appendChild(document.createElement("br"));
            el.appendChild(document.createTextNode(line));
          });
        }
      })();
      var glCanvas = document.getElementById("gl-canvas");
      var gl = glCanvas.getContext("webgl", { preserveDrawingBuffer: true });

      if (!gl) {
        // GPU 不可用 → GSAP-only 简单缩放保底
        var rootEl = document.getElementById("root");
        gsap.set(rootEl, { scale: 0.85 });
        var tl = gsap.timeline({ paused: true });
        tl.to(rootEl, { scale: 1.0, duration: 2.0, ease: "power3.out" }, 0);
        tl.to(rootEl, { scale: 0.85, duration: 2.0, ease: "power3.in" }, 2.0);
        window.__timelines["main"] = tl;
      } else {
        gl.viewport(0, 0, 1200, 1080);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
        var sceneTextures = {};

        function captureScene(sceneId) {
          var scene = document.getElementById(sceneId);
          var origOpacity = scene.style.opacity;
          scene.style.opacity = "1";
          scene.offsetHeight;
          var c = document.createElement("canvas");
          c.width = 1200; c.height = 1080;
          var ctx = c.getContext("2d");
          ctx.fillStyle = window.getComputedStyle(scene).backgroundColor;
          ctx.fillRect(0, 0, 1200, 1080);
          var sr = scene.getBoundingClientRect();
          var els = scene.querySelectorAll("*");
          for (var i = 0; i < els.length; i++) {
            var el = els[i];
            var cs = window.getComputedStyle(el);
            if (cs.display === "none" || cs.visibility === "hidden") continue;
            var r = el.getBoundingClientRect();
            if (r.width < 1 || r.height < 1) continue;
            var x = r.left - sr.left, y = r.top - sr.top, w = r.width, h = r.height;
            ctx.save();
            ctx.globalAlpha = parseFloat(cs.opacity) || 1;
            var bg = cs.backgroundColor;
            if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") {
              ctx.fillStyle = bg;
              ctx.fillRect(x, y, w, h);
            }
            var text = "";
            for (var j = 0; j < el.childNodes.length; j++) {
              if (el.childNodes[j].nodeType === 3) text += el.childNodes[j].textContent;
            }
            text = text.trim();
            if (text) {
              ctx.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
              ctx.fillStyle = cs.color;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(text, x + w / 2, y + h / 2);
            }
            ctx.restore();
          }
          scene.style.opacity = origOpacity;
          var tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
          sceneTextures[sceneId] = tex;
        }

        var vertSrc = "attribute vec2 a_pos; varying vec2 v_uv; void main(){" +
          "v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0,1);}";
        var quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        function compileShader(src, type) {
          var s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        }
        function mkProg(fragSrc) {
          var p = gl.createProgram();
          gl.attachShader(p, compileShader(vertSrc, gl.VERTEX_SHADER));
          gl.attachShader(p, compileShader(fragSrc, gl.FRAGMENT_SHADER));
          gl.linkProgram(p);
          return p;
        }

        var H = "precision mediump float; varying vec2 v_uv; uniform sampler2D u_from, u_to; uniform float u_progress; uniform vec2 u_resolution;";
        var progPass = mkProg(H + "void main(){gl_FragColor=texture2D(u_from,v_uv);}");
        var progTrans = mkProg(H +
          "void main(){vec2 d=v_uv-vec2(.5);float fromS=u_progress*.08;float toS=(1.-u_progress)*.06;" +
          "float fr=0.,fg=0.,fb=0.;for(int i=0;i<12;i++){float f=float(i)/12.;fr+=texture2D(u_from,v_uv-d*(fromS*1.06)*f).r;fg+=texture2D(u_from,v_uv-d*fromS*f).g;fb+=texture2D(u_from,v_uv-d*(fromS*.94)*f).b;}" +
          "vec3 fromBl=vec3(fr,fg,fb)/12.;float tr=0.,tg=0.,tb=0.;for(int i=0;i<12;i++){float f=float(i)/12.;tr+=texture2D(u_to,v_uv+d*(toS*1.06)*f).r;tg+=texture2D(u_to,v_uv+d*toS*f).g;tb+=texture2D(u_to,v_uv+d*(toS*.94)*f).b;}" +
          "vec3 toBl=vec3(tr,tg,tb)/12.;gl_FragColor=vec4(mix(fromBl,toBl,u_progress),1.);}");

        function renderShader(prog, texFrom, texTo, progress) {
          gl.useProgram(prog);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texFrom);
          gl.uniform1i(gl.getUniformLocation(prog, "u_from"), 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, texTo);
          gl.uniform1i(gl.getUniformLocation(prog, "u_to"), 1);
          gl.uniform1f(gl.getUniformLocation(prog, "u_progress"), progress);
          gl.uniform2f(gl.getUniformLocation(prog, "u_resolution"), 1200, 1080);
          var pos = gl.getAttribLocation(prog, "a_pos");
          gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
          gl.enableVertexAttribArray(pos);
          gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        function easeInOut(p) { return p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2; }

        captureScene("s1");
        captureScene("s2");
        glCanvas.style.display = "block";
        renderShader(progPass, sceneTextures["s1"], sceneTextures["s1"], 0);
        document.querySelectorAll(".scene").forEach(function (s) { s.style.opacity = "0"; });

        var tl = gsap.timeline({
          paused: true,
          onUpdate: function () {
            var t = tl.time();
            if (t >= 1.0 && t < 3.0) {
              renderShader(progTrans, sceneTextures["s1"], sceneTextures["s2"], easeInOut((t - 1.0) / 2.0));
            } else if (t >= 3.0) {
              renderShader(progPass, sceneTextures["s2"], sceneTextures["s2"], 0);
            } else {
              renderShader(progPass, sceneTextures["s1"], sceneTextures["s1"], 0);
            }
          },
        });
        tl.to({ v: 0 }, { v: 1, duration: 4, ease: "none" }, 0);
        window.__timelines["main"] = tl;
      }
    </script>
  </body>
</html>
