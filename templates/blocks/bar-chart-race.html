<!doctype html>
<!--
  Mistake page block: ranked bars that overtake each other in a time series.
  Source: https://github.com/heygen-com/hyperframes (Apache-2.0)
  Adapted for micro-course `mistake` page-role.

  Page-role fit
  ─────────────
  - 展示学生常见的错误类型 + 各自占比
  - 横轴时间推进时，长条互相超越，leader 用 accent 色高亮
  - 适合 "5 类常见错误历年分布"、"3 个高频错点答题正确率" 这类数据

  CONFIG（在 <script> 里搜 "EDIT ME" 改下面这几行）
  ──────────────────────────────────────────────────
  - title       : 标题
  - subtitle    : 副标题
  - periods[]   : 时间标签（注意：CSV 形式，不能含中文逗号）
  - series[]    : 每行 "Name: v1, v2, v3, ..."
  - accent      : leader 色（建议用课堂 warning 色 #c8452d 或你的 teaching 主题色）

  1920x1080 12s。GSAP 3.14+（CDN）。
  完整版（含更多 CSS 注释）见 upstream：
  https://github.com/heygen-com/hyperframes/blob/main/docs/catalog/blocks/bar-chart-race.mdx
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Bar Chart Race</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background-color: #f5f3ef; }
    </style>
  </head>
  <body>
    <div id="bcr-root" data-composition-id="bar-chart-race" data-width="1920" data-height="1080" data-start="0" data-duration="12">
      <div id="bcr-stage" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="bcr-bg"></div>
        <div id="bcr-head">
          <div id="bcr-head-left">
            <h1 id="bcr-title">学生常见错误分布</h1>
            <p id="bcr-subtitle">按错误类型统计的占比</p>
          </div>
          <div id="bcr-head-right">
            <span id="bcr-period-caption">年级</span>
            <span id="bcr-period">三</span>
          </div>
        </div>
        <div id="bcr-plot"></div>
        <div id="bcr-axis"></div>
        <p id="bcr-source">示例数据</p>
      </div>
      <style>
        #bcr-root {
          position: relative; width: 1920px; height: 1080px; overflow: hidden;
          font-family: Inter, sans-serif; color: #1f1d1b;
        }
        #bcr-stage { position: absolute; inset: 0; }
        #bcr-bg { position: absolute; inset: 0; background-color: #f5f3ef; }
        #bcr-head {
          position: absolute; top: 58px; left: 96px; width: 1728px;
          display: flex; align-items: flex-start; justify-content: space-between;
        }
        #bcr-title { font-size: 46px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.1; }
        #bcr-subtitle { margin-top: 10px; font-size: 19px; font-weight: 400; color: #6b6560; }
        #bcr-head-right { display: flex; flex-direction: column; align-items: flex-end; }
        #bcr-period-caption {
          font-size: 15px; font-weight: 600; letter-spacing: 0.18em;
          text-transform: uppercase; color: #6b6560;
        }
        #bcr-period {
          margin-top: 4px; font-size: 72px; font-weight: 700; line-height: 1;
          font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
        }
        #bcr-plot {
          position: absolute; left: 0; top: 236px; width: 1920px; height: 760px; overflow: hidden;
        }
        .bcr-row { position: absolute; left: 0; top: 0; width: 1920px; }
        .bcr-name {
          position: absolute; left: 96px; width: 272px; top: 50%; transform: translateY(-50%);
          text-align: right; font-size: 26px; font-weight: 600; line-height: 1.7;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
          background-color: #f5f3ef;
        }
        .bcr-bar {
          position: absolute; left: 400px; top: 50%; transform: translateY(-50%);
          border-radius: 3px; background-color: #1f1d1b;
        }
        .bcr-value {
          position: absolute; left: 404px; top: 50%; padding: 0 12px;
          font-size: 26px; font-weight: 600; line-height: 1.7;
          font-variant-numeric: tabular-nums; white-space: nowrap;
          background-color: #f5f3ef;
        }
        #bcr-axis { position: absolute; inset: 0; z-index: 5000; }
        .bcr-tick-line {
          position: absolute; top: 232px; left: 0; width: 1px; height: 768px;
          background-color: rgba(31, 29, 27, 0.11);
        }
        .bcr-tick-line.bcr-tick-zero { background-color: rgba(31, 29, 27, 0.5); }
        .bcr-tick-label {
          position: absolute; top: 198px; left: 0; font-size: 17px; font-weight: 500;
          font-variant-numeric: tabular-nums; color: #6b6560; white-space: nowrap;
        }
        #bcr-source {
          position: absolute; left: 96px; top: 1014px; font-size: 16px; color: #6b6560;
        }
      </style>
      <script>
        (function () {
          "use strict";
          window.__timelines = window.__timelines || {};

          // EDIT ME: 改成你的题目；集成层经 window.__BLOCK_CONFIG 覆盖
          var V = Object.assign(
            {
              title: "学生常见错误分布",
              subtitle: "按错误类型统计的占比",
              periods: "三, 四, 五, 六",
              series:
                "时态混淆: 28, 32, 30, 35\n" +
              "第三人称单数: 22, 25, 28, 24\n" +
              "be 动词漏用: 18, 15, 12, 10\n" +
              "介词搭配: 12, 14, 16, 18\n" +
              "词性误用: 10, 8, 9, 8",
            barCount: 5,
              periodDuration: 3,
              accent: "#c8452d",
            },
            window.__BLOCK_CONFIG || {}
          );

          function num(value, fallback, lo, hi) {
            var n = typeof value === "number" ? value : Number.parseFloat(value);
            if (!Number.isFinite(n)) n = fallback;
            return Math.min(hi, Math.max(lo, n));
          }
          function str(value, fallback) { return typeof value === "string" && value.length > 0 ? value : fallback; }
          function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

          var ACCENT = str(V.accent, "#c8452d");
          var BAR_COLOR = "#1f1d1b";
          var BAR_COUNT = Math.round(num(V.barCount, 5, 1, 24));
          var PERIOD_DURATION = num(V.periodDuration, 3, 0.1, 30);

          var PERIODS = String(V.periods).split(",").map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
          if (PERIODS.length === 0) PERIODS = ["1"];
          var T = PERIODS.length;

          function parseSeries(text, periodCount) {
            var out = [];
            var lines = String(text).split(/[\n;]+/);
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i].trim();
              if (!line) continue;
              var split = line.indexOf(":");
              if (split < 0) continue;
              var label = line.slice(0, split).trim();
              if (!label) continue;
              var values = line.slice(split + 1).split(",").map(function (s) { return Number.parseFloat(s.trim()); }).filter(function (n) { return Number.isFinite(n); });
              if (values.length === 0) continue;
              while (values.length < periodCount) values.push(values[values.length - 1]);
              out.push({ label: label, values: values.slice(0, periodCount) });
            }
            return out;
          }
          var SERIES = parseSeries(str(V.series, ""), PERIODS.length);
          var N = SERIES.length;

          var K = 10;
          var KF_DURATION = PERIOD_DURATION / K;
          var KF_COUNT = T > 1 ? (T - 1) * K + 1 : 1;
          var RACE_SECONDS = T > 1 ? (T - 1) * PERIOD_DURATION : 0;

          function valueAt(t, series) {
            if (T < 2) return series.values[0];
            var u = t / PERIOD_DURATION;
            var i = clamp(Math.floor(u), 0, T - 2);
            var f = clamp(u - i, 0, 1);
            return series.values[i] + (series.values[i + 1] - series.values[i]) * f;
          }

          var RANKS = [];
          for (var m = 0; m < KF_COUNT; m++) {
            var tm = m * KF_DURATION;
            var order = SERIES.map(function (s, j) { return { j: j, v: valueAt(tm, s) }; });
            order.sort(function (a, b) { return b.v - a.v || a.j - b.j; });
            var row = new Array(N);
            for (var r = 0; r < order.length; r++) row[order[r].j] = r;
            RANKS.push(row);
          }

          function smoothstep(x) { return x * x * (3 - 2 * x); }
          function rankPosAt(t, j) {
            if (KF_COUNT < 2) return RANKS[0][j];
            var m = t / KF_DURATION;
            var m0 = clamp(Math.floor(m), 0, KF_COUNT - 2);
            var e = smoothstep(clamp(m - m0, 0, 1));
            var a = RANKS[m0][j];
            var b = RANKS[m0 + 1][j];
            return a + (b - a) * e;
          }

          function hexToRgb(hex) {
            var h = String(hex).trim().replace("#", "");
            if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            var n = Number.parseInt(h, 16);
            if (!Number.isFinite(n)) return [31, 29, 27];
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
          }
          function hexToCss(hex) { var rgb = hexToRgb(hex); return "rgb(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ")"; }

          function niceStep(x) {
            var e = Math.pow(10, Math.floor(Math.log10(x)));
            var f = x / e;
            return e * (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
          }

          var TRACK_X = 400, TRACK_W = 1180, PLOT_H = 760;
          var PITCH = PLOT_H / BAR_COUNT;
          var BAR_H = Math.max(12, PITCH * 0.62);
          var TICK_POOL = 12;

          var plot = document.getElementById("bcr-plot");
          var axis = document.getElementById("bcr-axis");
          var periodEl = document.getElementById("bcr-period");
          document.getElementById("bcr-title").textContent = V.title;
          document.getElementById("bcr-subtitle").textContent = V.subtitle;

          var rows = SERIES.map(function (s) {
            var row = document.createElement("div");
            row.className = "bcr-row";
            row.style.height = PITCH + "px";
            var name = document.createElement("div");
            name.className = "bcr-name";
            name.textContent = s.label;
            var bar = document.createElement("div");
            bar.className = "bcr-bar";
            bar.style.height = BAR_H + "px";
            var value = document.createElement("div");
            value.className = "bcr-value";
            row.appendChild(name); row.appendChild(bar); row.appendChild(value);
            plot.appendChild(row);
            return { row: row, bar: bar, value: value };
          });

          var ticks = [];
          for (var k = 0; k < TICK_POOL; k++) {
            var line = document.createElement("div");
            line.className = "bcr-tick-line" + (k === 0 ? " bcr-tick-zero" : "");
            var label = document.createElement("div");
            label.className = "bcr-tick-label";
            axis.appendChild(line);
            axis.appendChild(label);
            ticks.push({ line: line, label: label });
          }

          function render(t) {
            if (N === 0) return;
            var values = SERIES.map(function (s) { return valueAt(t, s); });
            var byValue = values.map(function (v, i) { return i; }).sort(function (a, b) { return values[b] - values[a] || a - b; });
            var leader = byValue[0];
            var maxValue = values[leader];
            var scaleMax = Math.max(maxValue * 1.06, 1e-6);
            var step = niceStep(scaleMax / 4);

            for (var i = 0; i < TICK_POOL; i++) {
              var tv = i * step;
              var visible = tv <= scaleMax;
              var tx = TRACK_X + (tv / scaleMax) * TRACK_W;
              ticks[i].line.style.transform = "translateX(" + tx.toFixed(2) + "px)";
              ticks[i].line.style.opacity = visible ? "1" : "0";
              ticks[i].label.style.transform = "translateX(" + tx.toFixed(2) + "px) translateX(-50%)";
              ticks[i].label.style.opacity = visible ? "1" : "0";
              ticks[i].label.textContent = visible ? String(Math.round(tv)) : "";
            }

            for (var j = 0; j < rows.length; j++) {
              var rankPos = rankPosAt(t, j);
              var barW = (values[j] / scaleMax) * TRACK_W;
              var el = rows[j];
              el.row.style.transform = "translateY(" + (rankPos * PITCH).toFixed(2) + "px)";
              el.row.style.opacity = clamp(BAR_COUNT - rankPos, 0, 1).toFixed(3);
              el.bar.style.width = barW.toFixed(2) + "px";
              el.bar.style.backgroundColor = j === leader ? hexToCss(ACCENT) : hexToCss(BAR_COLOR);
              el.value.style.transform = "translate(" + barW.toFixed(2) + "px, -50%)";
              el.value.textContent = String(Math.round(values[j])) + "%";
            }
            var pIndex = clamp(Math.floor(t / PERIOD_DURATION), 0, T - 1);
            periodEl.textContent = PERIODS[pIndex];
          }

          var driver = { _t: 0 };
          Object.defineProperty(driver, "t", {
            get: function () { return this._t; },
            set: function (value) { this._t = value; render(value); },
          });

          var tl = gsap.timeline({ paused: true });
          if (RACE_SECONDS > 0) tl.to(driver, { t: RACE_SECONDS, duration: RACE_SECONDS, ease: "none" }, 0);
          render(0);
          window.__timelines["bar-chart-race"] = tl;
        })();
      </script>
      <div style="position:absolute;right:28px;bottom:16px;z-index:9999;font-size:18px;color:rgba(31,29,27,0.45);font-family:sans-serif;pointer-events:none;">Motion by hyperframes</div>
    </div>
  </body>
</html>
