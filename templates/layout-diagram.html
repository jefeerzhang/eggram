<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
body{width:__W__px;height:__H__px;background:linear-gradient(135deg,__BG__ 0%,__BG2__ 100%);font-family:__FONT__;color:__INK__;overflow:hidden}
.stage{position:relative;width:100%;height:100%;padding:28px 50px 20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
.hd{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px}
.title{font-size:__TITLE_SIZE__px;font-weight:800;color:__INK__;letter-spacing:1px}
.badge{font-size:__BADGE_SIZE__px;color:__ACCENT__;border:1.5px solid __ACCENT__;border-radius:999px;padding:3px 14px;white-space:nowrap;opacity:.92}
.rule{width:48px;height:3px;background:__ACCENT__;border-radius:2px;margin:6px 0 2px}
.sub{font-size:__SUB_SIZE__px;color:__INK_SUB__;letter-spacing:.5px;max-width:920px;margin-bottom:8px}
.content-box{display:flex;align-items:stretch;justify-content:center;gap:24px;width:100%;max-width:1180px;flex:1;min-height:0}
.chart-container{flex:1.2;background:__SURFACE__;border:1px solid __SURFACE_BORDER__;border-radius:18px;padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.chart-svg{width:100%;height:100%;max-height:380px}
.card{flex:0.85;background:__SURFACE__;border:1px solid __SURFACE_BORDER__;border-radius:18px;padding:20px 24px;box-shadow:0 4px 20px rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center}
.body{font-size:__BODY_SIZE__px;line-height:1.55;font-weight:500;text-align:left}
.hl{color:__ACCENT__;font-weight:800}
.err{color:__WRONG__;font-weight:800}
.draw-path{stroke-dasharray:1;stroke-dashoffset:0}
.chart-animated .draw-path{stroke-dashoffset:1;animation:pathDraw 1.8s cubic-bezier(.4,.0,.2,1) forwards}
@keyframes pathDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.stagger-item{opacity:1}
.chart-animated .stagger-item{opacity:0;animation:staggerIn .45s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes staggerIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.glow-point{opacity:1}
.chart-animated .glow-point{opacity:0;animation:glowPulse .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes glowPulse{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.3)}100%{opacity:1;transform:scale(1)}}
</style></head><body class="__CHART_MOTION__">
<div class="stage">
  <div class="hd"><div class="title">__HEADER__</div><div class="badge">__BADGE__</div></div>
  <div class="rule"></div>
  <div class="sub">__SUB__</div>
  <div class="content-box">
    <div class="chart-container">__CHART__</div>
    <div class="card"><div class="body">__BODY__</div></div>
  </div>
</div>
</body></html>
